version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/quest-tennis-trainer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/quest-tennis-trainer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/services/blockchain/node"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/services/blockchain/client"
    schedule:
      interval: "weekly"
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/cdk-patterns"
    schedule:
      interval: "weekly"
    groups:
      cdk-deps:
        patterns:
          - "*"
