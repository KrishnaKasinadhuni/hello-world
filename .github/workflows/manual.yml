name: Manual workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Person to greet'
        default: 'World'
        required: true
        type: string

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Send greeting safely via environment variable
        env:
          GREET_NAME: ${{ inputs.name }}
        run: echo "Hello ${GREET_NAME}"
